<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GÉNIE+ RDC | Admin Secure</title>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#f4f4f4}
header{background:#ff6a00;color:#fff;text-align:center;padding:25px}

.container{max-width:900px;margin:auto;padding:20px}

.card{background:#fff;padding:15px;margin:10px 0;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,0.1)}

input,textarea{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:8px;
}

button{
  background:#ff6a00;
  color:#fff;
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.hidden{display:none}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
</style>
</head>

<body>

<header>
  <h1>GÉNIE+ RDC</h1>
  <p>Dashboard Administrateur Sécurisé</p>
</header>

<div class="container">

<!-- LOGIN -->
<div id="loginBox" class="card">
  <h2>Connexion Admin</h2>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Mot de passe">
  <button onclick="login()">Se connecter</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

  <div class="topbar">
    <h2>Admin Panel</h2>
    <button onclick="logout()">Déconnexion</button>
  </div>

  <div class="card">
    <h3>Ajouter un projet</h3>
    <input id="title" placeholder="Titre">
    <textarea id="desc" placeholder="Description"></textarea>
    <button onclick="addProject()">Publier</button>
  </div>

  <div class="card">
    <h3>Projets publiés</h3>
    <div id="list"></div>
  </div>

</div>

</div>

<script>

/* ================= FIREBASE CONFIG ================= */
const firebaseConfig = {
  apiKey: "TON_API_KEY",
  authDomain: "TON_PROJECT.firebaseapp.com",
  projectId: "TON_PROJECT_ID"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

/* ================= LOGIN ================= */
function login(){
  auth.signInWithEmailAndPassword(email.value, password.value)
  .then(user=>{
    showDashboard();
  })
  .catch(err=>{
    alert("Erreur : " + err.message);
  });
}

/* ================= LOGOUT ================= */
function logout(){
  auth.signOut().then(()=>location.reload());
}

/* ================= SHOW DASHBOARD ================= */
function showDashboard(){
  loginBox.classList.add("hidden");
  dashboard.classList.remove("hidden");
  loadProjects();
}

/* ================= AUTO LOGIN ================= */
auth.onAuthStateChanged(user=>{
  if(user){
    showDashboard();
  }else{
    loginBox.classList.remove("hidden");
    dashboard.classList.add("hidden");
  }
});

/* ================= ADD PROJECT ================= */
function addProject(){
  db.collection("projets").add({
    title:title.value,
    description:desc.value,
    date:new Date()
  });

  title.value="";
  desc.value="";
}

/* ================= LOAD PROJECTS ================= */
function loadProjects(){
  db.collection("projets").onSnapshot(snapshot=>{
    let html="";
    snapshot.forEach(doc=>{
      html+=`
        <div class="card">
          <h4>${doc.data().title}</h4>
          <p>${doc.data().description}</p>
          <button onclick="deleteProject('${doc.id}')">Supprimer</button>
        </div>
      `;
    });
    list.innerHTML = html;
  });
}

/* ================= DELETE ================= */
function deleteProject(id){
  db.collection("projets").doc(id).delete();
}

</script>

</body>
</html>
