<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GÉNIE+ RDC | Dashboard</title>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#f4f4f4;color:#111}

/* HEADER */
header{
  background:linear-gradient(90deg,#ff6a00,#ff2d00);
  color:#fff;
  text-align:center;
  padding:25px;
}

/* LAYOUT */
.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

/* CARD */
.card{
  background:#fff;
  padding:15px;
  margin:10px 0;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

/* INPUTS */
input,textarea{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:8px;
}

/* BUTTON */
button{
  background:#ff6a00;
  color:#fff;
  padding:10px 15px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

/* NAV */
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
}

/* HIDE */
.hidden{display:none}

/* WHATSAPP */
.whatsapp{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#25D366;
  color:#fff;
  padding:14px;
  border-radius:50px;
  text-decoration:none;
}
</style>
</head>

<body>

<header>
  <h1>GÉNIE+ RDC</h1>
  <p>Dashboard Administrateur</p>
</header>

<div class="container">

<!-- ================= LOGIN ================= -->
<div id="loginBox" class="card">
  <h2>Connexion Admin</h2>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Mot de passe">
  <button onclick="login()">Se connecter</button>
</div>

<!-- ================= ADMIN PANEL ================= -->
<div id="adminPanel" class="hidden">

  <div class="top">
    <h2>Dashboard Projets</h2>
    <button onclick="logout()">Déconnexion</button>
  </div>

  <div class="card">
    <h3>Ajouter un projet</h3>
    <input id="title" placeholder="Titre du projet">
    <textarea id="desc" placeholder="Description"></textarea>
    <button onclick="addProject()">Publier</button>
  </div>

  <div class="card">
    <h3>Projets publiés</h3>
    <div id="projects"></div>
  </div>

</div>

</div>

<a class="whatsapp" href="https://wa.me/243852677025" target="_blank">WhatsApp</a>

<script>

/* ================= FIREBASE CONFIG ================= */
const firebaseConfig = {
  apiKey: "XXXX",
  authDomain: "XXXX",
  projectId: "XXXX"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const auth = firebase.auth();

/* ================= LOGIN ================= */
function login(){
  auth.signInWithEmailAndPassword(
    email.value,
    password.value
  )
  .then(()=>{
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("adminPanel").classList.remove("hidden");
    loadProjects();
  })
  .catch(err=>alert(err.message));
}

/* ================= LOGOUT ================= */
function logout(){
  auth.signOut();
  location.reload();
}

/* ================= ADD PROJECT ================= */
function addProject(){
  db.collection("projets").add({
    title:title.value,
    description:desc.value,
    date:new Date()
  });

  title.value="";
  desc.value="";
}

/* ================= LOAD PROJECTS ================= */
function loadProjects(){
  db.collection("projets").onSnapshot(snapshot=>{
    let html="";
    snapshot.forEach(doc=>{
      html+=`
        <div class="card">
          <h3>${doc.data().title}</h3>
          <p>${doc.data().description}</p>
          <button onclick="deleteProject('${doc.id}')">Supprimer</button>
        </div>
      `;
    });
    document.getElementById("projects").innerHTML=html;
  });
}

/* ================= DELETE ================= */
function deleteProject(id){
  db.collection("projets").doc(id).delete();
}

/* ================= AUTO CHECK LOGIN ================= */
auth.onAuthStateChanged(user=>{
  if(user){
    loginBox.classList.add("hidden");
    adminPanel.classList.remove("hidden");
    loadProjects();
  }
});

</script>

</body>
</html>
