<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GÉNIE+ RDC</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#f4f4f4}

/* NAV */
nav{
  background:#111;
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
}
nav a{
  color:#fff;
  padding:12px;
  text-decoration:none;
}

/* HERO */
.hero{
  text-align:center;
  padding:100px 20px;
  background:#f5f5f5;
}
.hero h1{color:#ff6a00;font-size:45px}

.btn{
  background:#ff6a00;
  color:#fff;
  padding:12px 18px;
  border-radius:8px;
  text-decoration:none;
  display:inline-block;
  margin-top:15px;
}

/* SECTION */
.section{
  max-width:1000px;
  margin:auto;
  padding:40px;
}

.card{
  background:#fff;
  padding:15px;
  margin:10px 0;
  border-radius:10px;
}

/* ADMIN */
.hidden{display:none}

input,textarea{
  width:100%;
  padding:10px;
  margin:8px 0;
}

button{
  background:#ff6a00;
  color:#fff;
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- ================= NAV PUBLIC ================= -->
<nav>
  <a href="#home">Accueil</a>
  <a href="#services">Services</a>
  <a href="#projects">Projets</a>
  <a href="#admin">Admin</a>
</nav>

<!-- ================= PAGE ACCUEIL PUBLIC ================= -->
<section class="hero" id="home">
  <h1>GÉNIE+ RDC</h1>
  <p>Construction • Ingénierie • Matériaux</p>
  <a class="btn" href="#services">Découvrir</a>
</section>

<section class="section" id="services">
  <h2>Nos Services</h2>
  <div class="card">Construction de bâtiments modernes</div>
  <div class="card">Études techniques</div>
  <div class="card">Fourniture matériaux</div>
</section>

<section class="section" id="projects">
  <h2>Projets</h2>
  <div id="projectList"></div>
</section>

<!-- ================= ADMIN ================= -->
<section class="section" id="admin">

<h2>Administration</h2>

<!-- LOGIN -->
<div id="loginBox" class="card">
  <h3>Connexion Admin</h3>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Mot de passe">
  <button onclick="login()">Se connecter</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

  <h3>Dashboard</h3>

  <input id="title" placeholder="Titre">
  <textarea id="desc" placeholder="Description"></textarea>
  <button onclick="addProject()">Publier</button>

  <h3>Liste projets</h3>
  <div id="adminList"></div>

  <button onclick="logout()">Déconnexion</button>
</div>

</section>

<script>

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "TON_API_KEY",
  authDomain: "TON_PROJECT.firebaseapp.com",
  projectId: "TON_PROJECT_ID"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

/* ================= LOGIN ================= */
function login(){
  auth.signInWithEmailAndPassword(email.value, password.value)
  .then(()=>{
    showDashboard();
  })
  .catch(err=>{
    alert("Erreur : " + err.message);
  });
}

/* ================= LOGOUT ================= */
function logout(){
  auth.signOut();
}

/* ================= DASHBOARD ================= */
function showDashboard(){
  loginBox.classList.add("hidden");
  dashboard.classList.remove("hidden");
  loadAdmin();
}

/* ================= AUTO LOGIN ================= */
auth.onAuthStateChanged(user=>{
  if(user){
    showDashboard();
  }else{
    loginBox.classList.remove("hidden");
    dashboard.classList.add("hidden");
  }
});

/* ================= ADD PROJECT ================= */
function addProject(){
  db.collection("projets").add({
    title:title.value,
    description:desc.value
  });

  title.value="";
  desc.value="";
}

/* ================= LOAD PUBLIC + ADMIN ================= */
function loadAdmin(){
  db.collection("projets").onSnapshot(snapshot=>{
    let html="";
    snapshot.forEach(doc=>{
      let p = doc.data();

      html += `
        <div class="card">
          <h4>${p.title}</h4>
          <p>${p.description}</p>
          <button onclick="deleteProject('${doc.id}')">Supprimer</button>
        </div>
      `;
    });

    adminList.innerHTML = html;
    projectList.innerHTML = html;
  });
}

/* ================= DELETE ================= */
function deleteProject(id){
  db.collection("projets").doc(id).delete();
}

</script>

</body>
</html>
